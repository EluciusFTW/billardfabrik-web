<mat-card appearance="outlined" [class]="matchClass()">
  <mat-card-content>
    <div class="match">
      <div class="player">
        <div class="name"> {{ match().playerOne.name}} </div>
        @if (!isWalk()) {
          @if (isStraightPool()) {
            <input #scoreP1
              class="score-input"
              type="number"
              step="1"
              [min]="minScore"
              [max]="match().length"
              [value]="match().playerOne.points"
              [disabled]="scoreEditDisabled()"
              (change)="setScore(match().playerOne, scoreP1)">
          } @else {
            <div class="score"> {{ match().playerOne.points }} </div>
            <div class="buttons" [style.visibility]="getVisibility(scoreEditDisabled())">
              <mat-icon [style.visibility]="getVisibility(plusDisabledP1())" (click)="plus(match().playerOne)">
                add_box
              </mat-icon>
              <mat-icon [style.visibility]="getVisibility(minusDisabledP1())" (click)="minus(match().playerOne)">
                indeterminate_check_box
              </mat-icon>
            </div>
          }
        }
      </div>
      <div class="player">
        <div class="name"> {{ match().playerTwo.name }} </div>
        @if (!isWalk()){
          @if (isStraightPool()) {
            <input #scoreP2
              class="score-input"
              type="number"
              step="1"
              [min]="minScore"
              [max]="match().length"
              [value]="match().playerTwo.points"
              [disabled]="scoreEditDisabled()"
              (change)="setScore(match().playerTwo, scoreP2)">
          } @else {
            <div class="score"> {{ match().playerTwo.points }} </div>
            <div class="buttons" [style.visibility]="getVisibility(scoreEditDisabled())">
              <mat-icon [style.visibility]="getVisibility(plusDisabledP2())" (click)="plus(match().playerTwo)">
                add_box
              </mat-icon>
              <mat-icon [style.visibility]="getVisibility(minusDisabledP2())" (click)="minus(match().playerTwo)">
                indeterminate_check_box
              </mat-icon>
            </div>
          }
        }
      </div>
    </div>
  </mat-card-content>
</mat-card>
