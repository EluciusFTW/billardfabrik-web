<app-content-tile header="Elo Rangliste">
  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (tab of tabs; track tab.link) {
      <a mat-tab-link
        [routerLink]="tab.link"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive">
        {{ tab.label }}
      </a>
    }
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</app-content-tile>
